# Runs every test on every push and pull request, so a change that breaks
# the calculations, the payouts app or the quote builder is caught at once.
name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Calculation tests
        run: npm test
      - name: Browser tests (payouts app, quote builder, standalone site)
        run: |
          npx --yes http-server -p 8080 -s . > /dev/null 2>&1 &
          npx --yes wait-on -t 30000 http://localhost:8080/payouts/
          node tests/payouts-e2e.mjs
          node tests/e2e.mjs
          node scripts/build-payment-site.mjs /tmp/site/payouts /payouts/
          (cd /tmp/site && npx --yes http-server -p 8082 -s . > /dev/null 2>&1 &)
          npx --yes wait-on -t 30000 http://localhost:8082/payouts/
          BASE_URL=http://localhost:8082/ node tests/payouts-e2e.mjs
