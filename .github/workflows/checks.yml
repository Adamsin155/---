# Runs every test on every push and pull request, so a change that breaks
# the calculations, the payouts app, the quote builder or the client protocol
# is caught at once.
name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Edge functions' copy of app/ is up to date (supabase/functions/_shared/app)
        run: node scripts/sync-functions.mjs --check
      - name: Calculation tests, and the database rules in a real Postgres (PGlite, every migration)
        run: npm test
      # The browser tests run against the published set only (what
      # scripts/build-pages.mjs puts on gh-pages), so a file the site needs
      # but the build leaves out fails here, not in production.
      - name: Browser tests (payouts app, quote builder, client protocol, team accounts, client messages, handoffs, owner screens, own-client access, notifications, production pages, the office's flows, characterization and shoot-day prep, standalone site)
        run: |
          node scripts/build-pages.mjs /tmp/pages
          npx --yes http-server /tmp/pages -p 8080 -s > /dev/null 2>&1 &
          npx --yes wait-on -t 30000 http://localhost:8080/payouts/
          node tests/payouts-e2e.mjs
          node tests/e2e.mjs
          node tests/protocol-e2e.mjs
          node tests/protocol-office-e2e.mjs
          node tests/now-bar-e2e.mjs
          node tests/team-e2e.mjs
          node tests/messages-e2e.mjs
          node tests/handoffs-e2e.mjs
          node tests/owner-e2e.mjs
          node tests/rls-e2e.mjs
          node tests/push-e2e.mjs
          node tests/production-e2e.mjs
          node tests/office-flows-e2e.mjs
          node tests/intake-e2e.mjs
          node tests/year-e2e.mjs
          node scripts/build-payment-site.mjs /tmp/site/payouts /payouts/
          (cd /tmp/site && npx --yes http-server -p 8082 -s . > /dev/null 2>&1 &)
          npx --yes wait-on -t 30000 http://localhost:8082/payouts/
          BASE_URL=http://localhost:8082/ node tests/payouts-e2e.mjs
