<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Only this site's own files, and the office's database and files (docs/ops.md, section 36). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://czncjzziqrqtezpwxxpz.supabase.co; media-src 'self' blob: https://czncjzziqrqtezpwxxpz.supabase.co; font-src 'self' data:; connect-src 'self' https://czncjzziqrqtezpwxxpz.supabase.co; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <!-- Never inside another site's frame. First, and not a module: it runs before the page is drawn. -->
  <script src="app/frame-guard.js"></script>
  <title>ימי צילום · astrateg</title>
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="app/assets/logo-mark.png">
  <link rel="manifest" href="clients.webmanifest">
  <link rel="apple-touch-icon" href="payouts/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#EEF0F4">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="אסטרטג לקוחות">
  <link rel="stylesheet" href="app/fonts/fonts.css">
  <link rel="stylesheet" href="app/styles/tokens.css">
  <link rel="stylesheet" href="app/styles/app.css">
  <link rel="stylesheet" href="app/styles/quotes.css">
  <link rel="stylesheet" href="app/styles/protocol.css">
  <link rel="stylesheet" href="app/styles/protocol-office.css">
  <link rel="stylesheet" href="app/styles/protocol-roles.css">
  <link rel="stylesheet" href="app/styles/push.css">
  <link rel="stylesheet" href="app/styles/production.css">
  <link rel="stylesheet" href="app/styles/shell.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="shoot.html" aria-label="astrateg · ימי צילום">
      <img class="brand-logo" src="app/assets/logo.png" alt="" width="403" height="280">
      <span class="brand-sep" aria-hidden="true"></span>
      <span class="brand-product">ימי צילום</span>
    </a>
    <nav aria-label="ניווט ראשי">
      <a class="navlink" href="shoot.html" aria-current="page">ימי צילום</a>
      <a class="navlink" href="clients.html#mine">המשימות שלי</a>
      <span class="session"><span class="dot" id="session-dot"></span><span class="who" id="session-who">לא מחובר</span></span>
      <button type="button" class="btn btn-sm btn-ghost" id="btn-logout" hidden>התנתקות</button>
    </nav>
  </header>

  <main class="list-shell" id="main">
    <section class="block" id="login-block" hidden aria-labelledby="lg-h">
      <form class="login" id="login-form" novalidate>
        <h2 id="lg-h">כניסה לצוות</h2>
        <p>ימי הצילום: אלי, וליאור במצב יום צילום.</p>
        <div class="field"><label for="lg-email">אימייל</label><input class="input" id="lg-email" type="email" dir="ltr" autocomplete="username" required></div>
        <div class="field"><label for="lg-pass">סיסמה</label><input class="input" id="lg-pass" type="password" dir="ltr" autocomplete="current-password" required></div>
        <div class="err" id="lg-err" role="alert" hidden></div>
        <div class="note-ok" id="lg-msg" role="status" hidden></div>
        <button type="submit" class="btn btn-primary" id="lg-submit">כניסה</button>
        <button type="button" class="btn-text" id="lg-forgot">שכחתי סיסמה</button>
      </form>
    </section>

    <div id="app" class="pr-app prod-page" hidden>
      <div class="page-head">
        <div>
          <div class="kicker latin">SHOOT DAYS</div>
          <h1 id="sh-h1">ימי הצילום שלי</h1>
          <p id="sh-sub"></p>
        </div>
        <div class="head-actions">
          <button type="button" class="btn btn-sm btn-ghost inbox-btn" id="btn-inbox" aria-haspopup="dialog" hidden>התראות</button>
          <button type="button" class="btn btn-sm btn-ghost" id="btn-refresh">רענון</button>
          <a class="btn btn-sm btn-ghost" href="clients.html#mine">המשימות שלי</a>
        </div>
      </div>

      <section class="push-card" id="push-card" aria-labelledby="push-h" hidden></section>
      <!-- The photographer's monthly availability (app/availability-ui.js): his card, or the office's folded line. -->
      <div id="availability" hidden></div>
      <p class="prod-summary" id="sh-summary" role="status"></p>
      <div class="prod-list" id="sh-list"></div>

      <section class="block prod-noaccess" id="no-access" hidden aria-labelledby="na-h">
        <h2 id="na-h">העמוד הזה לאלי ולליאור</h2>
        <p>כאן אלי רואה את ימי הצילום שלו, וליאור מנהל את יום הצילום מהטלפון.</p>
        <a class="btn" href="clients.html">חזרה ללקוחות</a>
      </section>
    </div>

    <p class="state" id="state" role="status"></p>
  </main>

  <dialog id="dlg-inbox" class="dlg-inbox" aria-labelledby="inbox-h">
    <div class="dlg-head">
      <h2 id="inbox-h" tabindex="-1">התראות היום</h2>
      <button type="button" class="close" data-close aria-label="סגירה">×</button>
    </div>
    <div class="dlg-body">
      <div class="inbox-tools">
        <p class="muted" id="inbox-sum"></p>
        <button type="button" class="btn-text" id="inbox-read">סימון הכול כנקרא</button>
      </div>
      <ul class="inbox-list" id="inbox-list"></ul>
    </div>
  </dialog>

  <div class="toast pr-toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="app/shoot.js"></script>
</body>
</html>
