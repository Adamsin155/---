# Supabase CLI settings for deploying functions from this repo
# (supabase functions deploy <name> --project-ref czncjzziqrqtezpwxxpz).
project_id = "astrateg-quotes"

# The team screen's function checks the caller's token itself (in code), so the
# gateway's JWT check is off. See supabase/functions/staff-admin/index.ts.
[functions.staff-admin]
verify_jwt = false

# The reminder engine: pg_cron calls it with the cron secret, and a signed-in
# staff member calls it for a test notification; both are checked in code. See
# supabase/functions/reminders/index.ts.
[functions.reminders]
verify_jwt = false

# Meta's WhatsApp webhook: Meta calls it without a Supabase token; it checks the
# signature (X-Hub-Signature-256) and the verify token itself. See
# supabase/functions/whatsapp-webhook/index.ts.
[functions.whatsapp-webhook]
verify_jwt = false

# The personal calendar feed: a calendar app sends no login; the secret token in
# the link is checked in code (public.calendar_feed_check). See
# supabase/functions/calendar/index.ts.
[functions.calendar]
verify_jwt = false

# The client's media (the view-only gallery and the graphics on the status page):
# the visitor has no login; the secret token in the link is checked in code
# (public.media_for_token). See supabase/functions/client-media/index.ts.
[functions.client-media]
verify_jwt = false

# The Drive counts for "עבודה לפי עובד": pg_cron calls it with the cron secret, checked in code.
[functions.drive-scan]
verify_jwt = false

# Claude accounts of the owners, Lior and Ofir (MCP): a client's first request has no token and must be
# answered with 401 and where to sign in; the OAuth token is checked in code on every request.
# See supabase/functions/mcp/index.ts.
[functions.mcp]
verify_jwt = false

# Metricool and the content Gantt: pg_cron calls it with the cron secret (the sync),
# and the office calls it signed in (the account's brands, the owner's connection
# check); each is checked in code. See supabase/functions/metricool/index.ts.
[functions.metricool]
verify_jwt = false
