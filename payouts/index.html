    <button type="button" class="nav-add" id="nav-add"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>עסקה חדשה</span></button>

  <main id="main" tabindex="-1">
    <div class="monthbar" id="monthbar" hidden>
      <button type="button" class="icon-btn" id="m-prev" aria-label="החודש הקודם"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>

    <div id="view"></div>
    <p class="state" id="state" role="status"></p>
  </main>

  <dialog id="dlg" aria-labelledby="dlg-title">
    <form method="dialog" class="sheet" id="dlg-form" novalidate>
      <div class="sheet-head">
        <h2 id="dlg-title"></h2>
        <button type="button" class="icon-btn" data-close aria-label="סגירה"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="sheet-body" id="dlg-body"></div>
      <div class="sheet-foot" id="dlg-foot"></div>
